---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gates.platform.glueops.dev
  labels:
    platform.glueops.dev/bundle: platform-crds
spec:
  group: platform.glueops.dev
  names:
    kind: Gate
    plural: gates
    shortNames:
      - gate
    singular: gate
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - jsonPath: .status.conditions[?(@.type=="Ready")].reason
          name: Reason
          type: string
        - jsonPath: .status.conditions[?(@.type=="Ready")].lastTransitionTime
          name: Last-Transition
          type: date
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          properties:
            spec:
              properties:
                checks:
                  description: Dependencies that must all be ready. Each entry sets exactly one check type; ids must be unique.
                  items:
                    properties:
                      argoApplicationHealthy:
                        properties:
                          name:
                            minLength: 1
                            type: string
                          requireHealthy:
                            default: true
                            type: boolean
                          requireSynced:
                            default: true
                            type: boolean
                        required:
                          - name
                        type: object
                      deploymentAvailable:
                        properties:
                          minAvailableReplicas:
                            default: 1
                            minimum: 0
                            type: integer
                          name:
                            minLength: 1
                            type: string
                        required:
                          - name
                        type: object
                      fluxHelmReleaseReady:
                        properties:
                          name:
                            minLength: 1
                            type: string
                          requireCurrentGeneration:
                            default: true
                            type: boolean
                        required:
                          - name
                        type: object
                      id:
                        maxLength: 63
                        minLength: 1
                        type: string
                      jobComplete:
                        properties:
                          name:
                            minLength: 1
                            type: string
                        required:
                          - name
                        type: object
                      namespace:
                        maxLength: 63
                        minLength: 1
                        type: string
                      podLabelReady:
                        properties:
                          minReadyPods:
                            default: 1
                            minimum: 0
                            type: integer
                          selector:
                            minLength: 1
                            type: string
                        required:
                          - selector
                        type: object
                      serviceReadyEndpoints:
                        properties:
                          minReadyAddresses:
                            default: 1
                            minimum: 0
                            type: integer
                          name:
                            minLength: 1
                            type: string
                        required:
                          - name
                        type: object
                      statefulSetReady:
                        properties:
                          minReadyReplicas:
                            default: 1
                            minimum: 0
                            type: integer
                          name:
                            minLength: 1
                            type: string
                          requireUpdatedRevision:
                            default: true
                            type: boolean
                        required:
                          - name
                        type: object
                    required:
                      - id
                    type: object
                    x-kubernetes-validations:
                      - message: each check must set exactly one check type
                        rule: |-
                          [has(self.deploymentAvailable), has(self.statefulSetReady),

                           has(self.jobComplete), has(self.serviceReadyEndpoints),
                           has(self.podLabelReady), has(self.argoApplicationHealthy),
                           has(self.fluxHelmReleaseReady)].exists_one(x, x)
                  maxItems: 256
                  minItems: 1
                  type: array
                  x-kubernetes-list-map-keys:
                    - id
                  x-kubernetes-list-type: map
              required:
                - checks
              type: object
            status:
              properties:
                conditions:
                  items:
                    properties:
                      lastTransitionTime:
                        format: date-time
                        type: string
                      message:
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        minimum: 0
                        type: integer
                      reason:
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        maxLength: 316
                        minLength: 1
                        type: string
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                observedGeneration:
                  minimum: 0
                  type: integer
                results:
                  description: Per-check verdicts from the last evaluation, one per spec.checks entry.
                  items:
                    properties:
                      id:
                        type: string
                      message:
                        type: string
                      ready:
                        type: boolean
                      reason:
                        type: string
                      terminal:
                        description: The dependency cannot become ready without a change; stop waiting.
                        type: boolean
                    required:
                      - id
                      - ready
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - id
                  x-kubernetes-list-type: map
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
