apiVersion: v2
name: platform-crds
description: GlueOps platform CRD bundle (layer-0; consume with helm show crds)
type: application
# Profiles: CRDs for conditionally-deployed components live in conditional subcharts, so a cluster installs only what
# its platform.yaml turns on. `helm show crds` still returns the UNION (values-independent); consumers select with
# `helm template --include-crds -f platform.yaml`. values.schema.json makes every profile key mandatory, so a renamed
# or missing key is a hard error instead of a silent fallback to the base set.
dependencies:
  - name: kubeadm
    version: 0.0.0
    condition: kubeadm.enabled
version: 0.1.4
appVersion: "0.0.0"
home: https://github.com/GlueOps/platform-crds
sources:
  - https://github.com/GlueOps/platform-crds
annotations:
  glueops.dev/pin.argo-cd: "v3.2.12"
  glueops.dev/pin.cert-manager: "v1.18.2"
  glueops.dev/pin.external-secrets: "v0.19.2"
  glueops.dev/pin.vpa: "1.6.0"
  glueops.dev/pin.traefik: "v40.3.0"
  glueops.dev/pin.kube-prometheus-stack: "59.1.0"
  glueops.dev/pin.keda: "v2.20.1"
  glueops.dev/pin.metacontroller: "v4.12.5"
  glueops.dev/pin.fluent-operator: "2.7.0"
  glueops.dev/pin.external-dns: "1.20.0"
