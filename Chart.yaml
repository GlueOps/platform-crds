apiVersion: v2
name: platform-crds
description: Every CustomResourceDefinition the GlueOps platform needs, applied by captain_utils BEFORE ArgoCD and BEFORE the platform chart. Packaging only — consume with `helm show crds` and `kubectl apply --server-side --force-conflicts`; never `helm install`.
