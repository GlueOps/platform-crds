name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]   # labeled: the version-removal guard reads the PR labels

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Render must be committed
        run: |
          kubectl version --client; yq --version; helm version --short
          hack/render.sh
          git status --porcelain crds charts Chart.yaml | tee /tmp/drift
          [ ! -s /tmp/drift ] || { echo "::error::crds/ or Chart.yaml pins are stale — run hack/render.sh and commit"; exit 1; }
      - name: Verify (completeness, forbidden groups, duplicates, package round-trip, pins)
        run: hack/verify.sh
      - name: Guard removed API versions
        run: hack/version-guard.sh "origin/${{ github.base_ref }}" "${{ github.event.pull_request.number }}"
      - name: Package
        run: helm package . --version 0.0.0-pr${{ github.event.pull_request.number }} -d /tmp/pkg && ls -la /tmp/pkg

  apply-on-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          node_image: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
          cluster_name: platform-crds
      - name: Server-side dry-run, apply, Established
        run: |
          # the union of every profile: a cluster only ever gets a subset, but all of it must apply cleanly
          dirs=""; for d in crds charts/*/crds; do dirs="$dirs -f $d"; done; echo "applying:$dirs"
          kubectl apply --server-side --force-conflicts --field-manager=glueops-platform-crds --dry-run=server $dirs | tail -3
          kubectl apply --server-side --force-conflicts --field-manager=glueops-platform-crds $dirs | tail -3
          kubectl wait --for=condition=Established crd --all --timeout=180s > /dev/null
          echo "$(kubectl get crd --no-headers | wc -l) CRDs Established"

  helm-matrix:
    # helm 4 is on its way into the codespace image (codespaces#439); helm show crds must keep working on both
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        helm: [v3.20.2, v4.2.3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}
      - run: |
          helm version --short
          helm package . --version 0.0.0-matrix -d /tmp/pkg >/dev/null
          tgz=/tmp/pkg/platform-crds-0.0.0-matrix.tgz
          total=$(ls crds charts/*/crds | grep -c '\.yaml$')
          # helm show crds: the values-independent UNION, one document per file
          n=$(helm show crds $tgz | yq -N '.metadata.name' | grep -v '^---$' | wc -l)
          [ "$n" -eq "$total" ] || { echo "::error::helm ${{ matrix.helm }}: helm show crds gave $n documents for $total files"; exit 1; }
          # helm template --include-crds: what a cluster actually installs, per profile (this is the consumer path)
          render() { helm template x $tgz --include-crds -f /tmp/v.yaml | yq -N 'select(. != null and .kind == "CustomResourceDefinition") | .metadata.name' | grep -c . || true; }
          base=$(ls crds | wc -l)
          for p in $(ls -d profiles/*/ | xargs -n1 basename); do
            printf '%s:\n  enabled: false\n' "$p" > /tmp/v.yaml; off=$(render)
            printf '%s:\n  enabled: true\n'  "$p" > /tmp/v.yaml; on=$(render)
            want=$(( base + $(ls charts/$p/crds | wc -l) ))
            [ "$off" -eq "$base" ] && [ "$on" -eq "$want" ] || { echo "::error::helm ${{ matrix.helm }}: profile $p rendered off=$off on=$on, wanted $base/$want"; exit 1; }
            echo "helm ${{ matrix.helm }}: profile $p off=$off on=$on ✓"
          done
          # a missing profile key must be a hard error, not a silent fallback to base
          printf '{}\n' > /tmp/v.yaml
          helm template x $tgz --include-crds -f /tmp/v.yaml >/dev/null 2>&1 && { echo "::error::helm ${{ matrix.helm }}: an empty values file rendered without error — profile keys are not mandatory"; exit 1; } || echo "helm ${{ matrix.helm }}: missing profile key rejected ✓"

  render-on-renovate:
    # renovate bumps a pin but cannot re-render; do it for it so renovate PRs are green without a human render.
    # The push must go through the App token: a push made with GITHUB_TOKEN never triggers a new CI run.
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: |
          hack/render.sh
          if [ -n "$(git status --porcelain crds charts Chart.yaml)" ]; then
            git config user.name github-actions && git config user.email github-actions[bot]@users.noreply.github.com
            git add crds charts Chart.yaml && git commit -m "chore: re-render crds/ for renovate bump" && git push
            echo "::notice::re-rendered crds/ and pushed to the renovate branch (re-run CI)"
          fi
