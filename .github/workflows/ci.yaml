name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]   # labeled: the version-removal guard reads the PR labels

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Render must be committed
        run: |
          kubectl version --client; yq --version; helm version --short
          hack/render.sh
          git status --porcelain crds Chart.yaml | tee /tmp/drift
          [ ! -s /tmp/drift ] || { echo "::error::crds/ or Chart.yaml pins are stale — run hack/render.sh and commit"; exit 1; }
      - name: Verify (completeness, forbidden groups, duplicates, package round-trip, pins)
        run: hack/verify.sh
      - name: Guard removed API versions
        run: hack/version-guard.sh "origin/${{ github.base_ref }}" "${{ github.event.pull_request.number }}"
      - name: Package
        run: helm package . --version 0.0.0-pr${{ github.event.pull_request.number }} -d /tmp/pkg && ls -la /tmp/pkg

  apply-on-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          node_image: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
          cluster_name: platform-crds
      - name: Server-side dry-run, apply, Established
        run: |
          kubectl apply --server-side --force-conflicts --field-manager=glueops-platform-crds --dry-run=server -f crds/ | tail -3
          kubectl apply --server-side --force-conflicts --field-manager=glueops-platform-crds -f crds/ | tail -3
          kubectl wait --for=condition=Established crd --all --timeout=180s > /dev/null
          echo "$(kubectl get crd --no-headers | wc -l) CRDs Established"

  helm-matrix:
    # helm 4 is on its way into the codespace image (codespaces#439); helm show crds must keep working on both
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        helm: [v3.20.2, v4.2.3]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}
      - run: |
          helm version --short
          helm package . --version 0.0.0-matrix -d /tmp/pkg >/dev/null
          n=$(helm show crds /tmp/pkg/platform-crds-0.0.0-matrix.tgz | yq -N '.metadata.name' | grep -v '^---$' | wc -l)
          [ "$n" -eq "$(ls crds | wc -l)" ] || { echo "::error::helm ${{ matrix.helm }}: $n documents for $(ls crds | wc -l) files"; exit 1; }

  render-on-renovate:
    # renovate bumps a pin but cannot re-render; do it for it so renovate PRs are green without a human render.
    # The push must go through the App token: a push made with GITHUB_TOKEN never triggers a new CI run.
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: |
          hack/render.sh
          if [ -n "$(git status --porcelain crds Chart.yaml)" ]; then
            git config user.name github-actions && git config user.email github-actions[bot]@users.noreply.github.com
            git add crds Chart.yaml && git commit -m "chore: re-render crds/ for renovate bump" && git push
            echo "::notice::re-rendered crds/ and pushed to the renovate branch (re-run CI)"
          fi
