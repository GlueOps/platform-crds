name: publish

# On every release tag (vX.Y.Z, cut by release-please) package Chart.yaml + crds/ and push the chart to GHCR as OCI.
# captain_utils consumes it through the mirror: helm show crds oci://ghcr.repo.gpkg.io/glueops/platform-crds --version X

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-oci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Package and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package . --version "$v" --app-version "$v" -d /tmp/pkg
          helm push "/tmp/pkg/platform-crds-$v.tgz" oci://ghcr.io/glueops
          helm registry logout ghcr.io
      - name: Assert the package is anonymously pullable on ghcr.io (never probe the mirror while it is private)
        run: |
          v="${GITHUB_REF_NAME#v}"
          helm show chart "oci://ghcr.io/glueops/platform-crds" --version "$v" >/dev/null 2>&1 || {
            echo "::error::ghcr.io/glueops/platform-crds is not anonymously pullable. First release? Set the package to Public under https://github.com/orgs/GlueOps/packages/container/platform-crds/settings and re-run this job (the mirror negative-caches misses)."; exit 1; }
      - name: Prove the package is pullable through the mirror (and warm its cache)
        run: |
          v="${GITHUB_REF_NAME#v}"; want=$(ls crds | wc -l)
          for i in $(seq 1 10); do
            got=$(helm show crds "oci://ghcr.repo.gpkg.io/glueops/platform-crds" --version "$v" 2>/dev/null | yq -N '.metadata.name' | grep -vc '^---$' || true)
            [ "${got:-0}" -eq "$want" ] && { echo "✅ $got CRDs via ghcr.repo.gpkg.io"; exit 0; }
            echo "attempt $i: got ${got:-0}/$want, retrying in 30s (mirror cache)"; sleep 30
          done
          echo "::error::platform-crds $v not pullable through ghcr.repo.gpkg.io — check package visibility (must be public) and the Nexus proxy"; exit 1
