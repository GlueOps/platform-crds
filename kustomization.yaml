patches:
  # OpenTelemetryCollector upstream serves v1alpha1 AND v1beta1 and relies on the operator's conversion webhook to
  # translate between them. The bundle cannot carry a conversion webhook (an orphan CRD with one is not inert — see
  # hack/verify.sh check 5), so only the storage version v1beta1 is served: with a single served version no conversion
  # is ever invoked and strategy None is correct. Everything the platform deploys is v1beta1 (otel-resources-helm);
  # v1alpha1 collectors are rejected by the API server instead of being silently mis-converted. The operator itself
  # reconciles v1beta1 and does not need v1alpha1 to be served. The `test` op fails the render if upstream reorders
  # spec.versions, so the index can never silently point at the wrong version.
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: opentelemetrycollectors.opentelemetry.io
    patch: |-
      - op: test
        path: /spec/versions/0/name
        value: v1alpha1
      - op: replace
        path: /spec/versions/0/served
        value: false
